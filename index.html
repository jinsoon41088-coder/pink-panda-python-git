
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>핑크판다 파이썬 퀴즈 게임</title>
    <style>
        body {
            background-color: #ffe4ef;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
        }

        .game {
            background: white;
            max-width: 480px;
            margin: 30px auto;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 5px 20px #e9b7ca;
        }

        h1 {
            color: #e75494;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            background: #ff85b3;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #e75494;
        }
    </style>
</head>
<body>

<div class="game" id="menu">
        <h1>🐼 핑크판다 퀴즈 게임 🐼</h1>
        <p>나만의 퀴즈 게임에 오신 것을 환영합니다!</p>

       <button onclick="showQuiz()">1. 📝 파이썬 퀴즈 풀기</button>
       <div id="quiz-area" style="display: none;">
    <h2>📝 파이썬 퀴즈 풀기</h2>
    <p id="quiz-question">Python에서 화면에 글자를 출력하는 함수는?</p>
   
<div id="quiz-options">
    <button onclick="checkAnswer(1)">1. input()</button>
    <button onclick="checkAnswer(2)">2. print()</button>
    <button onclick="checkAnswer(3)">3. len()</button>
    <button onclick="checkAnswer(4)">4. type()</button>
</div>

<button id="hint-button" onclick="showHint()">💡 힌트 보기</button>
<p id="quiz-hint" style="display: none;"></p>

    <p id="quiz-result"></p>
    <button id="next-button" onclick="nextQuestion()" style="display: none;">➡️ 다음 문제</button>
    <button id="home-button" onclick="goHome()" style="display: none;">🏠 메인 메뉴로 돌아가기</button>

</div>

<button onclick="showAddQuiz()">2. ➕ 퀴즈 추가</button>
<button onclick="showAddedQuizzes()">3. 📋 추가한 퀴즈 목록</button>
         
<button onclick="showHighScore()">4. 🏆 최고 점수 확인</button>


<p id="high-score-display" style="display: none; color: #ff1493; font-size: 22px; font-weight: bold; text-align: center;">🏆 최고 점수: 0점</p>

        <button>5. 🚪 퀴즈 종료</button>
    </div>

<div id="add-quiz-area" class="game" style="display: none;">
    <h2>🐼 새로운 퀴즈 추가하기</h2>
    <input id="new-question" type="text" placeholder="퀴즈 문제를 입력하세요"><br>
    <input id="new-option1" type="text" placeholder="1번 보기"><br>
    <input id="new-option2" type="text" placeholder="2번 보기"><br>
    <input id="new-option3" type="text" placeholder="3번 보기"><br>
    <input id="new-option4" type="text" placeholder="4번 보기"><br>
    <input id="new-answer" type="number" min="1" max="4" placeholder="정답 번호 (1~4)"><br>
    <button onclick="saveNewQuiz()">💾 퀴즈 저장하기</button>
    <button onclick="goHome()">🏠 홈으로 돌아가기</button>
</div>
 
<div id="added-quiz-list-area" class="game" style="display: none;">
    <h2>🐼 내가 추가한 퀴즈 목록</h2>
    <div id="added-quiz-list"></div>
    <button onclick="goHome()">🏠 홈으로 돌아가기</button>
</div>
   
<script>
    let quizzes = [];
    let score = 0;
    let highScore = Number(localStorage.getItem("pinkPandaHighScore")) || 0;
    let currentQuestion = 1;
    let answered = false;


function showHighScore() {
    const display = document.getElementById("high-score-display");
    display.textContent = "🏆 최고 점수: " + highScore + "점";


display.style.display = getComputedStyle(display).display === "none" ? "block" : "none";
}

function showAddQuiz() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("add-quiz-area").style.display = "block";
}

function saveNewQuiz() {
    const question = document.getElementById("new-question").value.trim();

    const options = [
        document.getElementById("new-option1").value.trim(),
        document.getElementById("new-option2").value.trim(),
        document.getElementById("new-option3").value.trim(),
        document.getElementById("new-option4").value.trim()
    ];

    const answer = Number(document.getElementById("new-answer").value);

    if (!question || options.some(option => !option)) {
        alert("문제와 보기 4개를 모두 입력해 주세요!");
        return;
    }

    if (!Number.isInteger(answer) || answer < 1 || answer > 4) {
        alert("정답 번호는 1부터 4까지 입력해 주세요!");
        return;
    }

    const newQuiz = { question, options, answer };

    const savedQuizzes = JSON.parse(
        localStorage.getItem("pinkPandaAddedQuizzes") || "[]"
    );

    savedQuizzes.push(newQuiz);

    localStorage.setItem(
        "pinkPandaAddedQuizzes",
        JSON.stringify(savedQuizzes)
    );
loadQuizzes();
    alert("🐼 새로운 퀴즈가 저장되었습니다!");
    
}

function showAddedQuizzes() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("added-quiz-list-area").style.display = "block";

    const savedQuizzes = JSON.parse(
        localStorage.getItem("pinkPandaAddedQuizzes") || "[]"
    );

    const list = document.getElementById("added-quiz-list");
    list.replaceChildren();

    if (savedQuizzes.length === 0) {
        list.textContent = "아직 추가한 퀴즈가 없습니다.";
        return;
    }

    savedQuizzes.forEach((quiz, index) => {
        const item = document.createElement("p");
        item.textContent = (index + 1) + ". " + quiz.question;
        list.appendChild(item);
    });
}
  
  
  
    function showQuiz() {
       document.getElementById("quiz-area").style.display = "block";
    }



function checkAnswer(number) {
    const result = document.getElementById("quiz-result");

    if (answered) {
        result.textContent = "🐼 이미 답을 선택한 문제입니다!";
        return;
    }

    answered = true;
    document.getElementById("next-button").style.display ="block";

    if (number === correctAnswer) {
        score += 20;
        result.textContent = "🎉 정답입니다! 현재 점수: " + score + "점";
        result.style.color = "green";
    } else {
        result.textContent = "❌ 오답입니다! 현재 점수: " + score + "점";
        result.style.color = "red";
    }
}


function nextQuestion() {
    currentQuestion += 1;

    document.getElementById("quiz-result").textContent = "";
    document.getElementById("next-button").style.display = "none";

    answered = false;

document.getElementById("quiz-hint").style.display = "none";
document.getElementById("quiz-hint").textContent = "";

    if (currentQuestion > quizzes.length) {

if (score > highScore) {
    highScore = score;
    localStorage.setItem("pinkPandaHighScore", highScore);
}

        document.getElementById("quiz-question").textContent =
            "🐼 퀴즈 완료! 최종 점수: " + score + "점";

        document.getElementById("quiz-options").style.display = "none";

document.getElementById("home-button").style.display = "block";

        return;
    }

    displayQuestion();
}


function showHint() {
    const question = quizzes[currentQuestion - 1];
    const hintElement = document.getElementById("quiz-hint");

    if (!question) {
        return;
    }

    hintElement.textContent = "💡 힌트: " + (question.hint || "등록된 힌트가 없어요.");
    hintElement.style.display = "block";
}

function displayQuestion() {
    const question = quizzes[currentQuestion - 1];

    if (!question) {
        return;
    }

    document.getElementById("quiz-question").textContent = question.question;

    const optionButtons = document.querySelectorAll("#quiz-options button");

    question.options.forEach(function(option, index) {
        optionButtons[index].textContent = (index + 1) + ". " + option;
    });

    correctAnswer = question.answer;
}

async function loadQuizzes() {
    try {
        const response = await fetch("web-quizzes.json");

        if (!response.ok) {
            throw new Error("퀴즈 파일을 불러올 수 없습니다.");
        }

        const data = await response.json();

const addedQuizzes = JSON.parse(
    localStorage.getItem("pinkPandaAddedQuizzes") || "[]"
);

quizzes = [...data.quizzes, ...addedQuizzes];
          displayQuestion();
        document.getElementById("quiz-question").textContent = quizzes[0].question;

const optionButtons = document.querySelectorAll("#quiz-options button");

quizzes[0].options.forEach(function(option, index) {
    optionButtons[index].textContent = (index + 1) + ". " + option;
});

        console.log("🐼 불러온 퀴즈:", data.quizzes);
        console.log("📝 퀴즈 개수:", data.quizzes.length);
    } catch (error) {
        console.error("❌ 퀴즈 불러오기 실패:", error);
    }
}

loadQuizzes();


function goHome() {
    document.getElementById("quiz-area").style.display = "none";
    document.getElementById("home-button").style.display = "none";
    document.getElementById("add-quiz-area").style.display = "none";
    document.getElementById("added-quiz-list-area").style.display = "none";
    document.getElementById("menu").style.display = "block";
}
  
</script>

</body>
</html>
